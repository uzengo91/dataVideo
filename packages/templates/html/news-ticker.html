<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"headline","default":"AI \u89c6\u9891\u5de5\u5177\u4ece\u539f\u578b\u8d70\u5411\u89c4\u6a21\u5316\u751f\u4ea7"},{"id":"subline","type":"string","label":"subline","default":"\u5168\u7403\u7f16\u8f91\u5ba4"},{"id":"items","type":"string","label":"items","default":"\u521b\u4f5c\u56e2\u961f\u4e0a\u7ebf\u5468\u671f\u7f29\u77ed 38%;\u6e32\u67d3\u961f\u5217 2 \u5206\u949f\u5185\u6e05\u7a7a;\u65b0\u7248\u76ee\u5f55\u5757\u5728\u4ea7\u54c1\u6f14\u793a\u4e2d\u8d70\u7ea2;\u7f16\u8f91\u56e2\u961f\u8f6c\u5411 HTML \u4f18\u5148\u52a8\u6548\u4f53\u7cfb"},{"id":"theme","type":"string","label":"theme","default":"dark-finance","enum":["dark-finance","light-tech","violet-trend","warm-sunrise","cool-mint","ink-classic"]}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>News Ticker</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: "Inter", sans-serif;
      }

      #nt-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
      }

      /* ---- dataNews themes ---- */
      #nt-root.theme-dark-finance { --bg:#0b0e14; --fg:#f5f7fa; --muted:#98a2b3; --accent:#22c55e; --accent2:#ef4444; --grid:rgba(255,255,255,0.08); background:var(--bg); color:var(--fg); }
      #nt-root.theme-light-tech { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --accent:#2563eb; --accent2:#dc2626; --grid:rgba(15,23,42,0.08); background:var(--bg); color:var(--fg); }
      #nt-root.theme-violet-trend { --bg:#17102b; --fg:#f3efff; --muted:#a89ec9; --accent:#a78bfa; --accent2:#fb7185; --grid:rgba(167,139,250,0.14); background:var(--bg); color:var(--fg); }
      #nt-root.theme-warm-sunrise { --bg:#2a1608; --fg:#fff7ed; --muted:#d6b899; --accent:#fb923c; --accent2:#ef4444; --grid:rgba(251,146,60,0.14); background:var(--bg); color:var(--fg); }
      #nt-root.theme-cool-mint { --bg:#f2fbf6; --fg:#0f2e22; --muted:#5f8a78; --accent:#10b981; --accent2:#f59e0b; --grid:rgba(16,185,129,0.12); background:var(--bg); color:var(--fg); }
      #nt-root.theme-ink-classic { --bg:#101210; --fg:#f5f0e6; --muted:#a89f8d; --accent:#d4af37; --accent2:#c0392b; --grid:rgba(212,175,55,0.12); background:var(--bg); color:var(--fg); }

      #nt-root .nt-shell {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 72px;
        height: 216px;
        filter: drop-shadow(0 28px 44px rgba(0, 0, 0, 0.32));
      }

      #nt-root .nt-panel {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border: 1px solid var(--grid);
        border-radius: 28px;
        background:
          linear-gradient(180deg, var(--bg), var(--bg)),
          linear-gradient(90deg, color-mix(in srgb, var(--accent2) 72%, transparent), transparent 38%);
      }

      #nt-root .nt-panel::before {
        position: absolute;
        inset: 0;
        content: "";
        background:
          radial-gradient(circle at 14% 0%, rgba(255, 255, 255, 0.2), transparent 26%),
          linear-gradient(
            110deg,
            transparent 0 42%,
            rgba(255, 255, 255, 0.06) 42% 43%,
            transparent 43% 100%
          );
        opacity: 0.72;
        pointer-events: none;
      }

      #nt-root .nt-top-row {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 126px;
        display: flex;
        align-items: stretch;
      }

      #nt-root .nt-brand {
        width: 294px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(135deg, var(--accent2), var(--accent));
        box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.16);
      }

      #nt-root .nt-live-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.55);
      }

      #nt-root .nt-brand-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-transform: uppercase;
      }

      #nt-root .nt-live {
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.16em;
      }

      #nt-root .nt-desk {
        font-size: 15px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.22em;
        color: rgba(255, 255, 255, 0.85);
      }

      #nt-root .nt-headline-wrap {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        padding: 0 250px 0 44px;
        overflow: hidden;
      }

      #nt-root .nt-headline {
        position: relative;
        z-index: 1;
        font-size: 48px;
        font-weight: 850;
        line-height: 1.02;
        letter-spacing: 0;
        white-space: nowrap;
        color: var(--fg);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.34);
      }

      #nt-root .nt-headline-accent {
        color: var(--accent);
      }

      #nt-root .nt-time {
        position: absolute;
        top: 25px;
        right: 38px;
        padding: 10px 16px;
        border: 1px solid var(--grid);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }

      #nt-root .nt-bottom-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 90px;
        display: flex;
        align-items: center;
        border-top: 1px solid var(--grid);
        background: rgba(2, 6, 13, 0.58);
      }

      #nt-root .nt-label {
        width: 294px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid var(--grid);
        background: color-mix(in srgb, var(--accent2) 78%, black);
        color: var(--fg);
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      #nt-root .nt-ticker-window {
        position: relative;
        flex: 1;
        height: 100%;
        overflow: hidden;
        background: color-mix(in srgb, var(--bg) 88%, black);
      }

      #nt-root .nt-ticker-window::before,
      #nt-root .nt-ticker-window::after {
        position: absolute;
        top: 0;
        bottom: 0;
        z-index: 2;
        width: 90px;
        content: "";
        pointer-events: none;
      }

      #nt-root .nt-ticker-window::before {
        left: 0;
        background: linear-gradient(90deg, var(--bg), transparent);
      }

      #nt-root .nt-ticker-window::after {
        right: 0;
        background: linear-gradient(270deg, var(--bg), transparent);
      }

      #nt-root .nt-ticker-track {
        position: absolute;
        left: 34px;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 34px;
        white-space: nowrap;
        will-change: transform;
      }

      #nt-root .nt-item {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 13px 18px;
        border: 1px solid var(--grid);
        border-radius: 999px;
        background: color-mix(in srgb, var(--fg) 7%, var(--bg));
        color: var(--fg);
        font-size: 31px;
        font-weight: 650;
        line-height: 1;
        letter-spacing: 0;
      }

      #nt-root .nt-separator {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 22px var(--accent);
      }

      #nt-root .nt-metric {
        padding: 4px 8px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--accent) 22%, var(--bg));
        color: var(--accent);
        font-weight: 850;
        font-variant-numeric: tabular-nums;
      }

      #nt-root .nt-flash {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -260px;
        z-index: 3;
        width: 210px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        transform: skewX(-16deg);
      }
    </style>
  </head>
  <body>
    <div
      id="nt-root"
      data-composition-id="news-ticker"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="7"
    >
      <section
        id="nt-shell"
        class="clip nt-shell"
        data-start="0"
        data-duration="7"
        data-track-index="0"
      >
        <div class="nt-panel">
          <div id="nt-flash" class="nt-flash"></div>
          <div class="nt-top-row">
            <div id="nt-brand" class="nt-brand">
              <div id="nt-live-dot" class="nt-live-dot"></div>
              <div class="nt-brand-text">
                <div class="nt-live">Live</div>
                <div class="nt-desk">Global Desk</div>
              </div>
            </div>
            <div class="nt-headline-wrap">
              <h1 id="nt-headline" class="nt-headline"></h1>
              <div id="nt-time" class="nt-time">09:41 UTC</div>
            </div>
          </div>
          <div class="nt-bottom-row">
            <div id="nt-label" class="nt-label">Breaking</div>
            <div class="nt-ticker-window">
              <div id="nt-ticker-track" class="nt-ticker-track"></div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---- dataNews variables ---- */
      var v = window.__hyperframes
        ? window.__hyperframes.getVariables()
        : (function () {
            var raw = document.documentElement.getAttribute("data-composition-variables");
            var out = {};
            JSON.parse(raw).forEach(function (d) { out[d.id] = d.default; });
            return out;
          })();

      var ntRoot = document.getElementById("nt-root");
      ntRoot.classList.add("theme-" + (v.theme || "dark-finance"));

      var headlineText = v.headline || "AI video tools move from prototype to production";
      var items = v.items
        ? String(v.items).split(";").map(function (s) { return s.trim(); }).filter(Boolean)
        : [
            "Creator teams shorten launch cycles by 38%",
            "Rendering queues clear in under 2 min",
            "New catalog blocks trending across product demos",
            "Studio editors adopt HTML-first motion systems",
          ];

      var headline = document.getElementById("nt-headline");
      headline.textContent = headlineText;

      /* subline maps to the small desk label in the brand block */
      var desk = document.querySelector("#nt-root .nt-desk");
      if (desk && v.subline) desk.textContent = v.subline;

      /* build ticker items (duplicated once for a seamless loop distance) */
      var tickerTrack = document.getElementById("nt-ticker-track");
      var buildItem = function (text) {
        var span = document.createElement("span");
        span.className = "nt-item";
        var sep = document.createElement("span");
        sep.className = "nt-separator";
        span.appendChild(sep);
        span.appendChild(document.createTextNode(text));
        return span;
      };
      items.concat(items).forEach(function (text) {
        tickerTrack.appendChild(buildItem(text));
      });

      var tl = gsap.timeline({ paused: true });
      var shell = document.getElementById("nt-shell");
      var brand = document.getElementById("nt-brand");
      var label = document.getElementById("nt-label");
      var liveDot = document.getElementById("nt-live-dot");
      var flash = document.getElementById("nt-flash");
      var time = document.getElementById("nt-time");

      gsap.set(shell, { y: 260, opacity: 0 });
      gsap.set(brand, { x: -80, opacity: 0 });
      gsap.set(headline, { y: 26, opacity: 0, clipPath: "inset(0 100% 0 0)" });
      gsap.set(label, { y: 18, opacity: 0 });
      gsap.set(time, { y: -10, opacity: 0 });
      gsap.set(tickerTrack, { x: 1260 });

      tl.to(shell, { y: 0, opacity: 1, duration: 0.52, ease: "power4.out" }, 0);
      tl.to(brand, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.08);
      tl.to(
        headline,
        {
          y: 0,
          opacity: 1,
          clipPath: "inset(0 0% 0 0)",
          duration: 0.62,
          ease: "power3.out",
        },
        0.18,
      );
      tl.to(time, { y: 0, opacity: 1, duration: 0.32, ease: "power2.out" }, 0.5);
      tl.to(label, { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" }, 0.55);
      tl.to(flash, { x: 2040, duration: 0.86, ease: "power2.inOut" }, 0.34);
      tl.to(
        tickerTrack,
        {
          x: -1120,
          duration: 6.05,
          ease: "none",
        },
        0.62,
      );
      tl.to(
        liveDot,
        {
          scale: 1.32,
          boxShadow: "0 0 0 18px rgba(255,255,255,0)",
          duration: 0.42,
          repeat: 11,
          yoyo: true,
          ease: "sine.inOut",
        },
        0.58,
      );
      tl.to(flash, { x: 4080, duration: 0.72, ease: "power2.inOut" }, 3.42);
      tl.to(shell, { y: 170, opacity: 0, duration: 0.34, ease: "power3.in" }, 6.62);

      window.__timelines["news-ticker"] = tl;
    </script>
  </body>
</html>
