<!-- hyperframes-registry-item: apple-money-count -->
<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"headline","default":"\u5e74\u5ea6\u603b\u8425\u6536"},{"id":"subline","type":"string","label":"subline","default":"\u5355\u4f4d\uff1a\u7f8e\u5143"},{"id":"endValue","type":"number","label":"endValue","default":10000},{"id":"prefix","type":"string","label":"prefix","default":"$"},{"id":"theme","type":"string","label":"theme","default":"dark-finance","enum":["dark-finance","light-tech","violet-trend","warm-sunrise","cool-mint","ink-classic"]}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #fdfefe);
      }

      /* ---- dataNews themes (root-level vars) ---- */
      .theme-dark-finance { --bg:#0b0e14; --fg:#f5f7fa; --muted:#98a2b3; --accent:#22c55e; --accent2:#ef4444; --grid:rgba(255,255,255,0.08); --brand:rgba(34,197,94,0.35); --accent-2:rgba(34,197,94,0.55); }
      .theme-light-tech { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --accent:#2563eb; --accent2:#dc2626; --grid:rgba(15,23,42,0.08); --brand:rgba(37,99,235,0.28); --accent-2:rgba(96,165,250,0.6); }
      .theme-violet-trend { --bg:#17102b; --fg:#f3efff; --muted:#a89ec9; --accent:#a78bfa; --accent2:#fb7185; --grid:rgba(167,139,250,0.14); --brand:rgba(167,139,250,0.35); --accent-2:rgba(196,181,253,0.6); }
      .theme-warm-sunrise { --bg:#2a1608; --fg:#fff7ed; --muted:#d6b899; --accent:#fb923c; --accent2:#ef4444; --grid:rgba(251,146,60,0.14); --brand:rgba(251,146,60,0.35); --accent-2:rgba(253,186,116,0.6); }
      .theme-cool-mint { --bg:#f2fbf6; --fg:#0f2e22; --muted:#5f8a78; --accent:#10b981; --accent2:#f59e0b; --grid:rgba(16,185,129,0.12); --brand:rgba(16,185,129,0.3); --accent-2:rgba(52,211,153,0.6); }
      .theme-ink-classic { --bg:#101210; --fg:#f5f0e6; --muted:#a89f8d; --accent:#d4af37; --accent2:#c0392b; --grid:rgba(212,175,55,0.12); --brand:rgba(212,175,55,0.35); --accent-2:rgba(231,201,110,0.6); }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg, #fdfefe);
        color: var(--fg, #111315);
        font-family: var(
          --font-display,
          -apple-system,
          BlinkMacSystemFont,
          "Helvetica Neue",
          Arial,
          sans-serif
        );
      }

      #am-headline {
        position: absolute;
        left: 0;
        right: 0;
        top: 140px;
        z-index: 6;
        text-align: center;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--fg, #111315);
      }

      #am-subline {
        position: absolute;
        left: 0;
        right: 0;
        top: 216px;
        z-index: 6;
        text-align: center;
        font-size: 28px;
        font-weight: 400;
        color: var(--muted, #64748b);
      }

      .green-flash {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: var(--accent, #30d158);
        opacity: 0;
      }

      .stage-content {
        position: relative;
        z-index: 5;
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: var(--space-3, 120px) var(--space-3, 160px);
      }

      .amount-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 1080px;
        min-height: 260px;
      }

      .amount {
        position: relative;
        color: var(--fg, #111315);
        font-size: 190px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
        text-shadow:
          0 3px 0 var(--bg, rgba(255, 255, 255, 0.58)),
          0 18px 36px var(--grid, rgba(17, 19, 21, 0.14)),
          0 42px 92px var(--grid, rgba(17, 19, 21, 0.1));
        will-change: transform, color, opacity, text-shadow;
      }

      .money-burst {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
      }

      .money-icon {
        position: absolute;
        left: 50%;
        top: 50%;
        display: grid;
        place-items: center;
        opacity: 0;
        filter: drop-shadow(0 20px 24px var(--brand, rgba(7, 84, 31, 0.2)));
        will-change: transform, opacity, filter;
      }

      .money-icon.bill {
        width: 96px;
        height: 52px;
        border-radius: var(--radius, 10px);
        background: var(--accent, #30d158);
        box-shadow:
          inset 0 0 0 3px var(--brand, rgba(7, 84, 31, 0.2)),
          inset 0 -10px 18px var(--brand, rgba(7, 84, 31, 0.1)),
          0 16px 26px var(--brand, rgba(7, 84, 31, 0.2)),
          0 34px 64px var(--brand, rgba(7, 84, 31, 0.16));
      }

      .money-icon.bill::before {
        position: absolute;
        inset: var(--space-1, 9px) var(--space-2, 16px);
        border: 2px solid var(--grid, rgba(7, 84, 31, 0.28));
        border-radius: 999px;
        content: "";
      }

      .money-icon.coin {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 34% 30%,
          var(--accent-2, #fff7a6) 0%,
          var(--accent, #ffd54f) 40%,
          var(--brand, #d9a514) 100%
        );
        box-shadow:
          inset 0 0 0 4px var(--brand, rgba(111, 76, 0, 0.12)),
          inset 0 -8px 14px var(--brand, rgba(111, 76, 0, 0.1)),
          0 16px 30px var(--brand, rgba(111, 76, 0, 0.18)),
          0 34px 58px var(--brand, rgba(111, 76, 0, 0.12));
      }

      .money-icon .mark {
        position: relative;
        z-index: 1;
        color: var(--bg, #07541f);
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
      }

      .money-icon.coin .mark {
        color: var(--bg, #6f4c00);
        font-size: 28px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="apple-money-count"
      data-root="true"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="greenFlash" class="green-flash"></div>
      <div id="am-headline"></div>
      <div id="am-subline"></div>
      <div class="stage-content">
        <div class="amount-wrap">
          <div id="amount" class="amount">$0</div>
        </div>
      </div>
      <div id="moneyBurst" class="money-burst" data-layout-allow-overflow></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      /* ---- dataNews variables ---- */
      var v = window.__hyperframes
        ? window.__hyperframes.getVariables()
        : (function () {
            var raw = document.documentElement.getAttribute("data-composition-variables");
            var out = {};
            JSON.parse(raw).forEach(function (d) { out[d.id] = d.default; });
            return out;
          })();

      var amRoot = document.getElementById("root");
      amRoot.classList.add("theme-" + (v.theme || "dark-finance"));

      var END_VALUE = typeof v.endValue === "number" ? v.endValue : parseFloat(v.endValue) || 10000;
      if (!isFinite(END_VALUE) || END_VALUE < 0) END_VALUE = 10000;
      var PREFIX = v.prefix !== undefined && v.prefix !== null ? String(v.prefix) : "$";

      var headlineEl = document.getElementById("am-headline");
      var sublineEl = document.getElementById("am-subline");
      headlineEl.textContent = v.headline || "";
      if (v.subline) {
        sublineEl.textContent = v.subline;
      } else {
        sublineEl.style.display = "none";
      }

      const amount = document.querySelector("#amount");
      const moneyBurst = document.querySelector("#moneyBurst");
      const countState = { value: 0 };

      function formatMoney(value) {
        const bounded = Math.max(0, Math.min(END_VALUE, value));
        const rounded = Math.round(bounded);
        return PREFIX + rounded.toLocaleString("en-US");
      }

      function renderAmount(value) {
        amount.textContent = formatMoney(value);
      }

      const moneyIcons = [];
      const moneySpecs = [];

      for (let i = 0; i < 62; i += 1) {
        const icon = document.createElement("div");
        const isCoin = i % 3 === 0;
        icon.className = "money-icon " + (isCoin ? "coin" : "bill");
        icon.innerHTML =
          '<span class="mark">' + (PREFIX.length <= 3 ? PREFIX : "$") + "</span>";
        moneyBurst.appendChild(icon);
        moneyIcons.push(icon);

        const angle = i * 2.399963229728653;
        const ring = i % 5;
        const radiusX = 260 + ring * 145 + (i % 7) * 12;
        const radiusY = 160 + ring * 78 + (i % 6) * 12;
        const offsetX = (i % 4) * 24 - 36;
        const offsetY = (i % 5) * 18 - 36;
        const x = Math.max(-865, Math.min(865, Math.cos(angle) * radiusX + offsetX));
        const y = Math.max(-465, Math.min(465, Math.sin(angle * 1.13) * radiusY + offsetY));

        moneySpecs.push({
          x,
          y,
          delay: (i % 8) * 0.025,
          duration: 0.74 + (i % 5) * 0.045,
          fadeDelay: (i % 5) * 0.05,
          rotation: ((i * 43) % 160) - 80,
          scale: isCoin ? 0.72 + (i % 4) * 0.08 : 0.68 + (i % 5) * 0.07,
        });
      }

      renderAmount(0);

      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: "power3.out" },
      });

      gsap.set(moneyIcons, {
        x: 0,
        y: 0,
        xPercent: -50,
        yPercent: -50,
        opacity: 0,
        scale: 0.18,
        transformOrigin: "50% 50%",
      });

      if (v.headline) tl.from(headlineEl, { opacity: 0, y: 30, duration: 0.55, ease: "power2.out" }, 0);
      if (v.subline) tl.from(sublineEl, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0.2);

      tl.from(
        "#amount",
        {
          y: 26,
          opacity: 0,
          scale: 0.985,
          duration: 0.45,
          ease: "power2.out",
        },
        0,
      );

      tl.to(
        countState,
        {
          value: END_VALUE,
          duration: 3.16,
          ease: "none",
          onUpdate: () => renderAmount(countState.value),
          onComplete: () => renderAmount(END_VALUE),
        },
        0,
      );

      tl.to(
        "#amount",
        {
          color: "var(--accent, #30d158)",
          textShadow:
            "0 3px 0 var(--bg, rgba(255,255,255,0.52)), 0 18px 40px var(--accent, rgba(48,209,88,0.3)), 0 46px 96px var(--brand, rgba(7,84,31,0.2))",
          duration: 0.18,
        },
        3.16,
      );
      tl.to("#amount", { scale: 1.06, duration: 0.16, ease: "back.out(2.2)" }, 3.16);
      tl.to("#amount", { scale: 1, duration: 0.23, ease: "power2.out" }, 3.33);

      tl.to("#greenFlash", { opacity: 0.34, duration: 0.08, ease: "none" }, 3.16);
      tl.to("#greenFlash", { opacity: 0.22, duration: 0.76, ease: "none" }, 3.24);
      tl.to("#greenFlash", { opacity: 0, duration: 0.16, ease: "power2.out" }, 4);

      moneyIcons.forEach((icon, i) => {
        const spec = moneySpecs[i];
        tl.to(
          icon,
          {
            x: spec.x,
            y: spec.y,
            rotation: spec.rotation,
            scale: spec.scale,
            opacity: 1,
            duration: spec.duration,
            ease: "power4.out",
          },
          3.28 + spec.delay,
        );
        tl.to(
          icon,
          {
            y: spec.y + (spec.y < 0 ? -58 : 58),
            scale: spec.scale * 0.54,
            opacity: 0,
            duration: 0.38,
            ease: "power2.in",
          },
          4.18 + spec.fadeDelay,
        );
      });

      tl.to("#amount", { opacity: 0, scale: 0.985, duration: 0.28, ease: "power2.in" }, 4.36);

      window.__timelines["apple-money-count"] = tl;
    </script>
  </body>
</html>
