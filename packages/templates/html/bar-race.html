<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "headline", "default": "\u54c1\u7c7b\u9500\u552e\u989d"}, {"id": "subline", "type": "string", "label": "subline", "default": "\u5355\u4f4d\uff1a\u4e07\u5143"}, {"id": "labels", "type": "string", "label": "labels", "default": "\u534e\u4e1c,\u534e\u5357,\u534e\u5317,\u897f\u5357,\u6d77\u5916"}, {"id": "values", "type": "string", "label": "values", "default": "420,365,298,180,155"}, {"id": "unit", "type": "string", "label": "unit", "default": "\u4e07"}, {"id": "theme", "type": "string", "label": "theme", "default": "light-tech"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* 渲染器字体声明：OS 内置字体用 local() 满足确定性检查 */
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
  @font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  /* ---------- 主题 ---------- */
  .theme-dark-finance {
    --bg: #0b0e14; --fg: #f5f7fa; --muted: #98a2b3;
    --accent: #22c55e; --accent2: #ef4444; --grid: rgba(255,255,255,0.08);
    background: var(--bg); color: var(--fg);
  }
  .theme-light-tech {
    --bg: #f8fafc; --fg: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent2: #dc2626; --grid: rgba(15,23,42,0.08);
    background: var(--bg); color: var(--fg);
  }

  .theme-violet-trend {
    --bg: #17102b; --fg: #f3efff; --muted: #a89ec9;
    --accent: #a78bfa; --accent2: #fb7185; --grid: rgba(167,139,250,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-warm-sunrise {
    --bg: #2a1608; --fg: #fff7ed; --muted: #d6b899;
    --accent: #fb923c; --accent2: #ef4444; --grid: rgba(251,146,60,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-cool-mint {
    --bg: #f2fbf6; --fg: #0f2e22; --muted: #5f8a78;
    --accent: #10b981; --accent2: #f59e0b; --grid: rgba(16,185,129,0.12);
    background: var(--bg); color: var(--fg);
  }
  .theme-ink-classic {
    --bg: #101210; --fg: #f5f0e6; --muted: #a89f8d;
    --accent: #d4af37; --accent2: #c0392b; --grid: rgba(212,175,55,0.12);
    background: var(--bg); color: var(--fg);
  }
</style>
</head>
<body>
<div id="bar-race" data-composition-id="bar-race"
     data-width="1920" data-height="1080" data-start="0" data-duration="10">

  <div class="br-wrap">
    <h1 id="br-headline" class="headline"></h1>
    <p id="br-subline" class="subline"></p>
    <div id="br-rows" class="rows"></div>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("bar-race");
  const v = window.__hyperframes
    ? window.__hyperframes.getVariables()
    : Object.fromEntries(JSON.parse(document.documentElement.getAttribute("data-composition-variables")).map(v => [v.id, v.default]));

  // 主题切换
  root.classList.add("theme-" + (v.theme || "dark-finance"));

  const headline = document.getElementById("br-headline");
  const subline = document.getElementById("br-subline");
  const rowsEl = document.getElementById("br-rows");
  headline.textContent = v.headline;
  subline.textContent = v.subline;

  // 解析并按数值降序排序（最多 6 条）
  const labels = String(v.labels || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
  const values = String(v.values || "").split(",").map(function (s) { return Number(s.trim()); })
    .filter(function (x) { return isFinite(x); });
  const items = labels.map(function (lab, i) { return { label: lab, value: values[i] || 0 }; })
    .slice(0, 6);
  items.sort(function (a, b) { return b.value - a.value; });

  const maxVal = items.length ? Math.max.apply(null, items.map(function (it) { return it.value; })) : 1;
  const unit = v.unit || "";

  function fmtNum(x) {
    const parts = Math.abs(x).toFixed(2).replace(/\.?0+$/, "").split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (x < 0 ? "-" : "") + parts.join(".");
  }

  // 构建 DOM：每行 = 类目标签 + 轨道(条 + 数值)；最大条宽 78% 轨道，给数值留空间
  const bars = [];
  for (let i = 0; i < items.length; i++) {
    const row = document.createElement("div");
    row.className = "row";
    const lab = document.createElement("span");
    lab.className = "cat";
    lab.textContent = items[i].label;
    const track = document.createElement("div");
    track.className = "track";
    const bar = document.createElement("div");
    bar.className = "bar" + (i === 0 ? " top" : "");
    bar.style.width = Math.max(2, (items[i].value / maxVal) * 78) + "%";
    const val = document.createElement("span");
    val.className = "val";
    val.textContent = fmtNum(items[i].value) + unit;
    track.appendChild(bar);
    track.appendChild(val);
    row.appendChild(lab);
    row.appendChild(track);
    rowsEl.appendChild(row);
    bars.push({ row: row, bar: bar, val: val });
  }

  // 动画（相对时间，秒）：行依次从左滑入，条依次 scaleX 生长，数值跟随淡入；入场 1.5s 内完成
  const tl = gsap.timeline({ paused: true });
  tl.from(headline, { opacity: 0, y: 40, duration: 0.5, ease: "power2.out" }, 0)
    .from(subline, { opacity: 0, duration: 0.4 }, 0.2);
  const step = Math.min(0.15, 0.8 / items.length);
  for (let i = 0; i < bars.length; i++) {
    const t0 = 0.3 + i * step;
    tl.from(bars[i].row, { opacity: 0, x: 60, duration: 0.35, ease: "power2.out" }, t0)
      .fromTo(bars[i].bar, { scaleX: 0.0001 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, t0 + 0.05)
      .from(bars[i].val, { opacity: 0, duration: 0.25 }, t0 + 0.35);
  }
  tl.to({}, { duration: 1.5 }); // 尾部停留

  window.__timelines = window.__timelines || {};
  window.__timelines["bar-race"] = tl;
})();
</script>

<style>
[data-composition-id="bar-race"] { background: var(--bg); color: var(--fg); width: 1920px; height: 1080px; position: relative; }
  [data-composition-id="bar-race"] .br-wrap {
    position: absolute; inset: 0; padding: 120px 160px;
  }
  [data-composition-id="bar-race"] .headline {
    font-size: 56px; font-weight: 600; letter-spacing: 1px;
  }
  [data-composition-id="bar-race"] .subline {
    font-size: 28px; color: var(--muted); margin-top: 10px;
  }
  [data-composition-id="bar-race"] .rows {
    margin-top: 56px; display: flex; flex-direction: column; gap: 40px;
  }
  [data-composition-id="bar-race"] .row {
    display: flex; align-items: center; gap: 32px;
  }
  [data-composition-id="bar-race"] .cat {
    width: 200px; flex: 0 0 200px; font-size: 36px; font-weight: 600; text-align: right;
  }
  [data-composition-id="bar-race"] .track {
    flex: 1; display: flex; align-items: center; gap: 24px; min-width: 0;
  }
  [data-composition-id="bar-race"] .bar {
    height: 64px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 35%, transparent);
    transform-origin: left center;
  }
  [data-composition-id="bar-race"] .bar.top { background: var(--accent); }
  [data-composition-id="bar-race"] .val {
    font-size: 36px; font-weight: 700; white-space: nowrap;
  }
</style>
</body>
</html>
