<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "headline", "default": "\u589e\u957f\u8d28\u91cf\u6301\u7eed\u6539\u5584"}, {"id": "subline", "type": "string", "label": "subline", "default": "\u2014\u2014 \u6458\u81ea Q3 \u8d22\u62a5\u7535\u8bdd\u4f1a"}, {"id": "theme", "type": "string", "label": "theme", "default": "dark-finance"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* 渲染器字体声明：OS 内置字体用 local() 满足确定性检查 */
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
  @font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  /* ---------- 主题 ---------- */
  .theme-dark-finance {
    --bg: #0b0e14; --fg: #f5f7fa; --muted: #98a2b3;
    --accent: #22c55e; --accent2: #ef4444; --grid: rgba(255,255,255,0.08);
    background: var(--bg); color: var(--fg);
  }
  .theme-light-tech {
    --bg: #f8fafc; --fg: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent2: #dc2626; --grid: rgba(15,23,42,0.08);
    background: var(--bg); color: var(--fg);
  }

  .theme-violet-trend {
    --bg: #17102b; --fg: #f3efff; --muted: #a89ec9;
    --accent: #a78bfa; --accent2: #fb7185; --grid: rgba(167,139,250,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-warm-sunrise {
    --bg: #2a1608; --fg: #fff7ed; --muted: #d6b899;
    --accent: #fb923c; --accent2: #ef4444; --grid: rgba(251,146,60,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-cool-mint {
    --bg: #f2fbf6; --fg: #0f2e22; --muted: #5f8a78;
    --accent: #10b981; --accent2: #f59e0b; --grid: rgba(16,185,129,0.12);
    background: var(--bg); color: var(--fg);
  }
  .theme-ink-classic {
    --bg: #101210; --fg: #f5f0e6; --muted: #a89f8d;
    --accent: #d4af37; --accent2: #c0392b; --grid: rgba(212,175,55,0.12);
    background: var(--bg); color: var(--fg);
  }
</style>
</head>
<body>
<div id="quote-insight" data-composition-id="quote-insight"
     data-width="1920" data-height="1080" data-start="0" data-duration="8">

  <div class="qi-wrap">
    <span id="qi-rule" class="rule"></span>
    <h1 id="qi-headline" class="quote"></h1>
    <p id="qi-subline" class="attribution"></p>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("quote-insight");
  const v = window.__hyperframes
    ? window.__hyperframes.getVariables()
    : Object.fromEntries(JSON.parse(document.documentElement.getAttribute("data-composition-variables")).map(v => [v.id, v.default]));

  // 主题切换
  root.classList.add("theme-" + (v.theme || "dark-finance"));

  // 文案注入（按字符数自适应字号，保持大留白不溢出）
  const headline = document.getElementById("qi-headline");
  const subline = document.getElementById("qi-subline");
  const rule = document.getElementById("qi-rule");
  headline.textContent = v.headline;
  subline.textContent = v.subline;
  const len = (v.headline || "").length;
  const size = len <= 12 ? 76 : len <= 18 ? 68 : len <= 26 ? 62 : 60;
  headline.style.fontSize = size + "px";

  // 动画（相对时间，秒）：装饰线展开 → 金句淡入上移 → 署名延迟出现；入场 1.5s 内完成
  const tl = gsap.timeline({ paused: true });
  tl.from(rule, { scaleX: 0, transformOrigin: "left center", duration: 0.45, ease: "power2.out" }, 0)
    .from(headline, { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 0.25)
    .from(subline, { opacity: 0, y: 16, duration: 0.5, ease: "power2.out" }, 1.0)
    .to({}, { duration: 1.5 }); // 尾部停留

  window.__timelines = window.__timelines || {};
  window.__timelines["quote-insight"] = tl;
})();
</script>

<style>
[data-composition-id="quote-insight"] { background: var(--bg); color: var(--fg); width: 1920px; height: 1080px; position: relative; }
  [data-composition-id="quote-insight"] .qi-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 0 240px;
  }
  [data-composition-id="quote-insight"] .rule {
    display: block; width: 120px; height: 10px; border-radius: 5px;
    background: var(--accent); margin-bottom: 56px;
  }
  [data-composition-id="quote-insight"] .quote {
    font-size: 72px; font-weight: 700; line-height: 1.4; letter-spacing: 1px;
    max-width: 1440px;
  }
  [data-composition-id="quote-insight"] .attribution {
    font-size: 30px; color: var(--muted); margin-top: 48px;
  }
</style>
</body>
</html>
