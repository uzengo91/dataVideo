<!-- hyperframes-registry-item: mk-progress-stat -->
<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"headline","default":"\u5e74\u5ea6\u76ee\u6807\u8fdb\u5ea6"},{"id":"subline","type":"string","label":"subline","default":"\u6570\u636e\u622a\u81f3\u672c\u5b63\u5ea6\u672b"},{"id":"value","type":"number","label":"value","default":22},{"id":"max","type":"number","label":"max","default":30},{"id":"label","type":"string","label":"label","default":"\u76ee\u6807\u8fbe\u6210"},{"id":"caption","type":"string","label":"caption","default":"\u8fdb\u5c55\u987a\u5229\uff0c\u79bb\u76ee\u6807\u8d8a\u6765\u8d8a\u8fd1\uff01"},{"id":"theme","type":"string","label":"theme","default":"dark-finance","enum":["dark-finance","light-tech","violet-trend","warm-sunrise","cool-mint","ink-classic"]}]'>
  <head>
    <meta charset="utf-8" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-ps-root {
        /* ---- mk tokens: re-skinned via the 6 dataNews themes ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-ink: var(--fg);
        --mk-ink-dim: var(--muted);
        --mk-accent: var(--accent);
        --mk-accent-dark: var(--accent);
        --mk-track: rgba(127, 127, 127, 0.25);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg); /* overlays footage or mk-background */
      }
      /* ---- dataNews themes ---- */
      .theme-dark-finance { --bg:#0b0e14; --fg:#f5f7fa; --muted:#98a2b3; --accent:#22c55e; --accent2:#ef4444; --grid:rgba(255,255,255,0.08); background:var(--bg); color:var(--fg); }
      .theme-light-tech { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --accent:#2563eb; --accent2:#dc2626; --grid:rgba(15,23,42,0.08); background:var(--bg); color:var(--fg); }
      .theme-violet-trend { --bg:#17102b; --fg:#f3efff; --muted:#a89ec9; --accent:#a78bfa; --accent2:#fb7185; --grid:rgba(167,139,250,0.14); background:var(--bg); color:var(--fg); }
      .theme-warm-sunrise { --bg:#2a1608; --fg:#fff7ed; --muted:#d6b899; --accent:#fb923c; --accent2:#ef4444; --grid:rgba(251,146,60,0.14); background:var(--bg); color:var(--fg); }
      .theme-cool-mint { --bg:#f2fbf6; --fg:#0f2e22; --muted:#5f8a78; --accent:#10b981; --accent2:#f59e0b; --grid:rgba(16,185,129,0.12); background:var(--bg); color:var(--fg); }
      .theme-ink-classic { --bg:#101210; --fg:#f5f0e6; --muted:#a89f8d; --accent:#d4af37; --accent2:#c0392b; --grid:rgba(212,175,55,0.12); background:var(--bg); color:var(--fg); }

      #mk-ps-headline {
        position: absolute;
        left: 130px;
        top: 110px;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.01em;
        color: var(--mk-ink);
        font-family: var(--mk-font);
      }
      #mk-ps-subline {
        position: absolute;
        left: 130px;
        top: 182px;
        font-weight: 400;
        font-size: 28px;
        color: var(--mk-ink-dim);
        font-family: var(--mk-font);
      }
      #mk-ps-group {
        position: absolute;
        font-family: var(--mk-font);
      }
      #mk-ps-num {
        font-weight: 600;
        font-size: 190px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--mk-ink);
        font-variant-numeric: tabular-nums;
      }
      #mk-ps-label {
        margin-top: 10px;
        font-weight: 500;
        font-size: 42px;
        letter-spacing: -0.01em;
        color: var(--mk-ink);
      }
      #mk-ps-track {
        position: relative;
        margin-top: 28px;
        height: 6px;
        border-radius: 3px;
        background: var(--mk-track);
        overflow: hidden;
      }
      #mk-ps-fill {
        position: absolute;
        inset: 0;
        border-radius: 3px;
        background: var(--mk-accent);
        transform-origin: left center;
      }
      #mk-ps-caption {
        margin-top: 22px;
        font-weight: 400;
        font-size: 30px;
        color: var(--mk-ink-dim);
      }
    </style>
  </head>
  <body>
    <div
      id="mk-ps-root"
      data-composition-id="mk-progress-stat"
      data-start="0"
      data-duration="7"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-ps-headline">KPI Progress</div>
      <div id="mk-ps-subline"></div>
      <div id="mk-ps-group">
        <div id="mk-ps-num">0</div>
        <div id="mk-ps-label"></div>
        <div id="mk-ps-track"><div id="mk-ps-fill"></div></div>
        <div id="mk-ps-caption"></div>
      </div>
      <div
        id="mk-ps-drv"
        class="clip"
        data-start="0"
        data-duration="7"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- dataNews variables ----
           A big count-up numeral, label, thin accent track filling to value/max, caption. */
        var v = window.__hyperframes
          ? window.__hyperframes.getVariables()
          : (function () {
              var raw = document.documentElement.getAttribute("data-composition-variables");
              var out = {};
              JSON.parse(raw).forEach(function (d) { out[d.id] = d.default; });
              return out;
            })();

        var root = document.getElementById("mk-ps-root");
        root.classList.add("theme-" + (v.theme || "dark-finance"));

        var CONFIG = {
          headline: v.headline || "KPI Progress",
          subline: v.subline || "",
          value: typeof v.value === "number" ? v.value : parseFloat(v.value) || 22,
          max: typeof v.max === "number" ? v.max : parseFloat(v.max) || 30,
          suffix: "",
          label: v.label || "Completed",
          caption: v.caption || "Great job, we are getting closer!",
          trackWidth: 480, // px
          x: 1300, // group left edge; null = centered
          y: 250, // group top edge; null = centered
          animationIn: true,
          animationOut: true,
        };
        if (!isFinite(CONFIG.max) || CONFIG.max <= 0) CONFIG.max = 30;

        var DUR = 7;
        var group = document.getElementById("mk-ps-group");
        var num = document.getElementById("mk-ps-num");
        var fill = document.getElementById("mk-ps-fill");
        var headlineEl = document.getElementById("mk-ps-headline");
        var sublineEl = document.getElementById("mk-ps-subline");

        headlineEl.textContent = CONFIG.headline;
        if (CONFIG.subline) sublineEl.textContent = CONFIG.subline;
        else sublineEl.style.display = "none";
        document.getElementById("mk-ps-label").textContent = CONFIG.label;
        document.getElementById("mk-ps-caption").textContent = CONFIG.caption;
        document.getElementById("mk-ps-track").style.width = CONFIG.trackWidth + "px";

        /* position (measure after filling text) */
        var rect = group.getBoundingClientRect();
        group.style.left =
          (CONFIG.x === null ? Math.round((1920 - rect.width) / 2) : CONFIG.x) + "px";
        group.style.top =
          (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

        var tl = gsap.timeline({ paused: true });

        gsap.set([headlineEl, sublineEl], { opacity: 0, y: 24 });
        tl.to(headlineEl, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
        if (CONFIG.subline) tl.to(sublineEl, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.25);

        gsap.set(group, { opacity: 0, y: 28 });
        tl.to(group, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.3);

        /* count-up + track fill on the same ease (the data-viz recipe) */
        var st = { v: 0 };
        tl.to(
          st,
          {
            v: CONFIG.value,
            duration: 1.6,
            ease: "power2.out",
            onUpdate: function () {
              num.textContent = Math.round(st.v) + CONFIG.suffix;
            },
          },
          0.5,
        );
        gsap.set(fill, { scaleX: 0 });
        tl.to(fill, { scaleX: CONFIG.value / CONFIG.max, duration: 1.6, ease: "power2.out" }, 0.5);

        tl.to(group, { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-progress-stat"] = tl;
      })();
    </script>
  </body>
</html>
