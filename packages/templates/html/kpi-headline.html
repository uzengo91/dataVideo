<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "headline", "default": "Q3 \u8425\u6536"}, {"id": "subline", "type": "string", "label": "subline", "default": "\u5355\u4f4d\uff1a\u4eba\u6c11\u5e01"}, {"id": "kpi", "type": "string", "label": "kpi", "default": "\u00a54.28\u4ebf"}, {"id": "delta", "type": "string", "label": "delta", "default": "+23%"}, {"id": "deltaLabel", "type": "string", "label": "deltaLabel", "default": "\u540c\u6bd4"}, {"id": "deltaDir", "type": "string", "label": "deltaDir", "default": "up"}, {"id": "theme", "type": "string", "label": "theme", "default": "dark-finance"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* 渲染器字体声明：OS 内置字体用 local() 满足确定性检查 */
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
  @font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  /* ---------- 主题 ---------- */
  .theme-dark-finance {
    --bg: #0b0e14; --fg: #f5f7fa; --muted: #98a2b3;
    --accent: #22c55e; --accent2: #ef4444; --grid: rgba(255,255,255,0.08);
    background: var(--bg); color: var(--fg);
  }
  .theme-light-tech {
    --bg: #f8fafc; --fg: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent2: #dc2626; --grid: rgba(15,23,42,0.08);
    background: var(--bg); color: var(--fg);
  }

  .theme-violet-trend {
    --bg: #17102b; --fg: #f3efff; --muted: #a89ec9;
    --accent: #a78bfa; --accent2: #fb7185; --grid: rgba(167,139,250,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-warm-sunrise {
    --bg: #2a1608; --fg: #fff7ed; --muted: #d6b899;
    --accent: #fb923c; --accent2: #ef4444; --grid: rgba(251,146,60,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-cool-mint {
    --bg: #f2fbf6; --fg: #0f2e22; --muted: #5f8a78;
    --accent: #10b981; --accent2: #f59e0b; --grid: rgba(16,185,129,0.12);
    background: var(--bg); color: var(--fg);
  }
  .theme-ink-classic {
    --bg: #101210; --fg: #f5f0e6; --muted: #a89f8d;
    --accent: #d4af37; --accent2: #c0392b; --grid: rgba(212,175,55,0.12);
    background: var(--bg); color: var(--fg);
  }
</style>
</head>
<body>
<div id="kpi-headline" data-composition-id="kpi-headline"
     data-width="1920" data-height="1080" data-start="0" data-duration="8">

  <div class="kpi-wrap">
    <h1 id="kpi-headline-text" class="headline">Q3 营收</h1>
    <p id="kpi-subline" class="subline">单位：人民币</p>
    <div class="kpi-row">
      <span id="kpi-value" class="kpi">¥4.28亿</span>
      <span id="kpi-delta" class="delta up">▲ +23%</span>
    </div>
    <p id="kpi-delta-label" class="delta-label">同比</p>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("kpi-headline");
  const v = window.__hyperframes
    ? window.__hyperframes.getVariables()
    : Object.fromEntries(JSON.parse(document.documentElement.getAttribute("data-composition-variables")).map(v => [v.id, v.default]));

  // 主题切换
  root.classList.add("theme-" + (v.theme || "dark-finance"));

  // 文案注入
  const headline = document.getElementById("kpi-headline-text");
  const subline = document.getElementById("kpi-subline");
  const kpi = document.getElementById("kpi-value");
  const delta = document.getElementById("kpi-delta");
  const deltaLabel = document.getElementById("kpi-delta-label");

  headline.textContent = v.headline;
  subline.textContent = v.subline;
  kpi.textContent = v.kpi;
  const dir = String(v.deltaDir) === "down" ? "down" : "up";
  const arrow = dir === "down" ? "▼" : "▲";
  delta.textContent = arrow + " " + v.delta;
  delta.className = "delta " + dir;
  deltaLabel.textContent = v.deltaLabel;

  // 动画（相对时间，秒）
  const tl = gsap.timeline({ paused: true });
  tl.from(headline, { opacity: 0, y: 40, duration: 0.6, ease: "power2.out" }, 0.1)
    .from(subline, { opacity: 0, duration: 0.4 }, 0.4)
    .from(kpi, { opacity: 0, scale: 0.85, duration: 0.7, ease: "back.out(1.6)" }, 0.6)
    .from(delta, { opacity: 0, x: 30, duration: 0.5 }, 1.1)
    .from(deltaLabel, { opacity: 0, duration: 0.4 }, 1.3)
    .to({}, { duration: 1.5 }); // 尾部停留，保证总时长 ≥ 数据展示需要

  window.__timelines = window.__timelines || {};
  window.__timelines["kpi-headline"] = tl;
})();
</script>

<style>
[data-composition-id="kpi-headline"] { background: var(--bg); color: var(--fg); width: 1920px; height: 1080px; position: relative; }
  [data-composition-id="kpi-headline"] .kpi-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 160px;
  }
  [data-composition-id="kpi-headline"] .headline {
    font-size: 64px; font-weight: 600; color: var(--muted); letter-spacing: 2px;
  }
  [data-composition-id="kpi-headline"] .subline {
    font-size: 28px; color: var(--muted); margin-top: 12px;
  }
  [data-composition-id="kpi-headline"] .kpi-row {
    display: flex; align-items: baseline; gap: 48px; margin-top: 48px;
  }
  [data-composition-id="kpi-headline"] .kpi {
    font-size: 220px; font-weight: 700; line-height: 1; letter-spacing: -2px;
  }
  [data-composition-id="kpi-headline"] .delta { font-size: 72px; font-weight: 700; }
  [data-composition-id="kpi-headline"] .delta.up { color: var(--accent); }
  [data-composition-id="kpi-headline"] .delta.down { color: var(--accent2); }
  [data-composition-id="kpi-headline"] .delta-label {
    font-size: 32px; color: var(--muted); margin-top: 40px;
  }
</style>
</body>
</html>
