<!-- hyperframes-registry-item: mk-line-graph -->
<!doctype html>
<html lang="en" data-composition-variables='[{"id":"headline","type":"string","label":"headline","default":"\u5b63\u5ea6\u8425\u6536\u8d70\u52bf"},{"id":"subline","type":"string","label":"subline","default":"\u5355\u4f4d\uff1a\u767e\u4e07\u7f8e\u5143"},{"id":"labels","type":"string","label":"labels","default":"1\u6708,2\u6708,3\u6708,4\u6708,5\u6708,6\u6708"},{"id":"series1","type":"string","label":"series1","default":"12,26,22,38,44,58"},{"id":"series2","type":"string","label":"series2","default":"8,14,18,16,28,36"},{"id":"theme","type":"string","label":"theme","default":"dark-finance","enum":["dark-finance","light-tech","violet-trend","warm-sunrise","cool-mint","ink-classic"]}]'>
  <head>
    <meta charset="utf-8" />
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-lg-root {
        /* ---- mk tokens: re-skinned via the 6 dataNews themes ---- */
        --mk-font: "Inter", -apple-system, sans-serif;
        --mk-ink: var(--fg);
        --mk-ink-dim: var(--muted);
        --mk-accent: var(--accent);
        --mk-paper: var(--bg);
        --mk-blob-2: var(--accent2);
        --mk-axis: var(--grid);

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg); /* overlays footage or mk-background */
        font-family: var(--mk-font);
      }
      /* ---- dataNews themes ---- */
      .theme-dark-finance { --bg:#0b0e14; --fg:#f5f7fa; --muted:#98a2b3; --accent:#22c55e; --accent2:#ef4444; --grid:rgba(255,255,255,0.08); background:var(--bg); color:var(--fg); }
      .theme-light-tech { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --accent:#2563eb; --accent2:#dc2626; --grid:rgba(15,23,42,0.08); background:var(--bg); color:var(--fg); }
      .theme-violet-trend { --bg:#17102b; --fg:#f3efff; --muted:#a89ec9; --accent:#a78bfa; --accent2:#fb7185; --grid:rgba(167,139,250,0.14); background:var(--bg); color:var(--fg); }
      .theme-warm-sunrise { --bg:#2a1608; --fg:#fff7ed; --muted:#d6b899; --accent:#fb923c; --accent2:#ef4444; --grid:rgba(251,146,60,0.14); background:var(--bg); color:var(--fg); }
      .theme-cool-mint { --bg:#f2fbf6; --fg:#0f2e22; --muted:#5f8a78; --accent:#10b981; --accent2:#f59e0b; --grid:rgba(16,185,129,0.12); background:var(--bg); color:var(--fg); }
      .theme-ink-classic { --bg:#101210; --fg:#f5f0e6; --muted:#a89f8d; --accent:#d4af37; --accent2:#c0392b; --grid:rgba(212,175,55,0.12); background:var(--bg); color:var(--fg); }

      #mk-lg-headline {
        position: absolute;
        left: 160px;
        top: 90px;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.01em;
        color: var(--mk-ink);
      }
      #mk-lg-subline {
        position: absolute;
        left: 160px;
        top: 162px;
        font-weight: 400;
        font-size: 28px;
        color: var(--mk-ink-dim);
      }
      #mk-lg-svg {
        position: absolute;
        inset: 0;
      }
      .mk-lg-line {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mk-lg-dot {
        stroke-width: 4;
        fill: var(--mk-paper);
      }
      .mk-lg-axis {
        stroke: var(--mk-axis);
        stroke-width: 2;
      }
      .mk-lg-value {
        position: absolute;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.01em;
        color: var(--mk-ink);
        font-variant-numeric: tabular-nums;
        /* Horizontal centring only. The label's vertical offset is baked into
           `top` instead of a CSS translate, because the entrance tween animates
           `y` and GSAP rewrites this transform, dropping any vertical shift. */
        transform: translate(-50%, 0);
        line-height: 38px;
        white-space: nowrap;
      }
      .mk-lg-xlabel {
        position: absolute;
        font-weight: 400;
        font-size: 26px;
        color: var(--mk-ink-dim);
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .mk-lg-legend {
        position: absolute;
        display: flex;
        gap: 40px;
      }
      .mk-lg-legend-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 500;
        font-size: 30px;
        color: var(--mk-ink-dim);
      }
      .mk-lg-legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="mk-lg-root"
      data-composition-id="mk-line-graph"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-lg-headline">Quarterly Trend</div>
      <div id="mk-lg-subline"></div>
      <svg id="mk-lg-svg" viewBox="0 0 1920 1080"></svg>
      <div id="mk-lg-labels"></div>
      <div
        id="mk-lg-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- dataNews variables ----
           Minimal presentation line graph: 1-2 series draw on, dots pop, value labels
           ride their points, axes dimmer than labels (clear hierarchy). */
        var v = window.__hyperframes
          ? window.__hyperframes.getVariables()
          : (function () {
              var raw = document.documentElement.getAttribute("data-composition-variables");
              var out = {};
              JSON.parse(raw).forEach(function (d) { out[d.id] = d.default; });
              return out;
            })();

        function toNums(str, fb) {
          if (!str) return fb;
          var arr = String(str).split(",").map(function (s) { return parseFloat(s.trim()); });
          if (arr.some(function (x) { return isNaN(x); })) return fb;
          return arr;
        }

        var root = document.getElementById("mk-lg-root");
        root.classList.add("theme-" + (v.theme || "dark-finance"));

        var CONFIG = {
          headline: v.headline || "Quarterly Trend",
          subline: v.subline || "",
          series: [
            { name: "Series 1", color: null /* accent */, values: toNums(v.series1, [12, 26, 22, 38, 44, 58]) },
            { name: "Series 2", color: null /* blob-2 */, values: toNums(v.series2, [8, 14, 18, 16, 28, 36]) },
          ],
          xLabels: v.labels
            ? String(v.labels).split(",").map(function (s) { return s.trim(); })
            : ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
          showValues: true,
          area: { x: 160, y: 300, w: 980, h: 460 }, // plot rectangle
          animationIn: true,
          animationOut: true,
        };

        /* single-series mode: empty series2 drops the second line */
        if (v.series2 === undefined || v.series2 === null || String(v.series2).trim() === "") {
          CONFIG.series = [CONFIG.series[0]];
        }

        var DUR = 8;
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.getElementById("mk-lg-svg");
        var labels = document.getElementById("mk-lg-labels");
        var A = CONFIG.area;

        var headlineEl = document.getElementById("mk-lg-headline");
        var sublineEl = document.getElementById("mk-lg-subline");
        headlineEl.textContent = CONFIG.headline;
        if (CONFIG.subline) sublineEl.textContent = CONFIG.subline;
        else sublineEl.style.display = "none";

        var accent = getComputedStyle(root).getPropertyValue("--mk-accent").trim();
        var blob2 = getComputedStyle(root).getPropertyValue("--mk-blob-2").trim();
        if (CONFIG.series[1] && !CONFIG.series[1].color) CONFIG.series[1].color = blob2;

        /* scale: 0..max(all values)*1.15 into the plot rect */
        var max = 0;
        CONFIG.series.forEach(function (s) {
          s.values.forEach(function (v) {
            if (v > max) max = v;
          });
        });
        max *= 1.15;
        var n = CONFIG.series[0].values.length;
        function px(i) {
          return A.x + (i / (n - 1)) * A.w;
        }
        function py(v) {
          return A.y + A.h - (v / max) * A.h;
        }

        /* baseline axis */
        var axis = document.createElementNS(NS, "line");
        axis.setAttribute("class", "mk-lg-axis");
        axis.setAttribute("x1", A.x - 20);
        axis.setAttribute("y1", A.y + A.h);
        axis.setAttribute("x2", A.x + A.w + 20);
        axis.setAttribute("y2", A.y + A.h);
        axis.id = "mk-lg-axis";
        svg.appendChild(axis);

        /* series paths, dots, value labels */
        var paths = [],
          dots = [],
          vals = [];
        CONFIG.series.forEach(function (s, si) {
          var color = s.color || accent;
          var d = s.values
            .map(function (v, i) {
              return (i === 0 ? "M" : "L") + px(i) + " " + py(v);
            })
            .join(" ");
          var path = document.createElementNS(NS, "path");
          path.setAttribute("class", "mk-lg-line");
          path.setAttribute("d", d);
          path.setAttribute("stroke", color);
          path.id = "mk-lg-path-" + si;
          svg.appendChild(path);
          paths.push(path);

          s.values.forEach(function (v, i) {
            var dot = document.createElementNS(NS, "circle");
            dot.setAttribute("class", "mk-lg-dot");
            dot.setAttribute("cx", px(i));
            dot.setAttribute("cy", py(v));
            dot.setAttribute("r", 9);
            dot.setAttribute("stroke", color);
            dot.id = "mk-lg-dot-" + si + "-" + i;
            svg.appendChild(dot);
            dots.push({ el: dot, si: si, i: i });

            if (CONFIG.showValues) {
              var val = document.createElement("div");
              /* Series after the first label downward. With every series
                 labelling upward the numbers collide wherever the lines run
                 close together. GAP clears the dot radius plus line stroke. */
              var below = si > 0;
              var GAP = 22;
              val.className = "mk-lg-value";
              val.id = "mk-lg-val-" + si + "-" + i;
              val.textContent = v;
              val.style.left = px(i) + "px";
              val.style.top = py(v) + (below ? GAP : -(GAP + 38)) + "px";
              labels.appendChild(val);
              vals.push({ el: val, si: si, i: i });
            }
          });
        });

        /* x labels + legend */
        CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
          var xl = document.createElement("div");
          xl.className = "mk-lg-xlabel";
          xl.id = "mk-lg-xl-" + i;
          xl.textContent = t;
          xl.style.left = px(i) + "px";
          xl.style.top = A.y + A.h + 24 + "px";
          labels.appendChild(xl);
        });
        var legend = document.createElement("div");
        legend.className = "mk-lg-legend";
        legend.id = "mk-lg-legend";
        legend.style.left = A.x + "px";
        legend.style.top = A.y + A.h + 90 + "px";
        CONFIG.series.forEach(function (s) {
          var item = document.createElement("div");
          item.className = "mk-lg-legend-item";
          var dot = document.createElement("span");
          dot.className = "mk-lg-legend-dot";
          dot.style.background = s.color || accent;
          item.appendChild(dot);
          item.appendChild(document.createTextNode(s.name));
          legend.appendChild(item);
        });
        labels.appendChild(legend);

        var tl = gsap.timeline({ paused: true });
        var DRAW = 1.3;

        /* entrance: headline + axis + x labels settle first */
        gsap.set([headlineEl, sublineEl, axis, legend], { opacity: 0 });
        tl.to(headlineEl, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
        if (CONFIG.subline) tl.to(sublineEl, { opacity: 1, duration: 0.4 }, 0.35);
        tl.to(axis, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
        CONFIG.xLabels.slice(0, n).forEach(function (t, i) {
          var xl = document.getElementById("mk-lg-xl-" + i);
          gsap.set(xl, { opacity: 0, y: 10 });
          tl.to(xl, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25 + i * 0.05);
        });

        /* draw each series, dots + values riding the draw front */
        CONFIG.series.forEach(function (s, si) {
          var t0 = (CONFIG.animationIn ? 0.5 : 0) + si * 0.35;
          var path = paths[si];
          var len = path.getTotalLength();
          gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
          tl.to(path, { strokeDashoffset: 0, duration: DRAW, ease: "power2.inOut" }, t0);

          s.values.forEach(function (v, i) {
            var dot = document.getElementById("mk-lg-dot-" + si + "-" + i);
            var td = t0 + (i / (n - 1)) * DRAW * 0.92;
            gsap.set(dot, { scale: 0, transformOrigin: "50% 50%" });
            tl.to(dot, { scale: 1, duration: 0.35, ease: "back.out(1.2)" }, td);
            if (CONFIG.showValues) {
              var val = document.getElementById("mk-lg-val-" + si + "-" + i);
              gsap.set(val, { opacity: 0, y: 8 });
              tl.to(val, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, td + 0.06);
            }
          });
        });

        tl.to(legend, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.3);

        /* exit + hard kill */
        if (CONFIG.animationOut) {
          tl.to([svg, labels, headlineEl, sublineEl], { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, DUR - 0.5);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-line-graph"] = tl;
      })();
    </script>
  </body>
</html>
