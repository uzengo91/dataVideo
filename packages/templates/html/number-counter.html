<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id": "headline", "type": "string", "label": "headline", "default": "\u5168\u5e74 GMV"}, {"id": "subline", "type": "string", "label": "subline", "default": "2024 \u5168\u5e74\u7d2f\u8ba1"}, {"id": "endValue", "type": "number", "label": "endValue", "default": 12.8}, {"id": "decimals", "type": "number", "label": "decimals", "default": 1}, {"id": "prefix", "type": "string", "label": "prefix", "default": "\u00a5"}, {"id": "suffix", "type": "string", "label": "suffix", "default": "\u4ebf"}, {"id": "theme", "type": "string", "label": "theme", "default": "dark-finance"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<style>
  /* 渲染器字体声明：OS 内置字体用 local() 满足确定性检查 */
  @font-face { font-family: "PingFang SC"; src: local("PingFang SC"); }
  @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
  @font-face { font-family: "Helvetica Neue"; src: local("Helvetica Neue"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  /* ---------- 主题 ---------- */
  .theme-dark-finance {
    --bg: #0b0e14; --fg: #f5f7fa; --muted: #98a2b3;
    --accent: #22c55e; --accent2: #ef4444; --grid: rgba(255,255,255,0.08);
    background: var(--bg); color: var(--fg);
  }
  .theme-light-tech {
    --bg: #f8fafc; --fg: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent2: #dc2626; --grid: rgba(15,23,42,0.08);
    background: var(--bg); color: var(--fg);
  }

  .theme-violet-trend {
    --bg: #17102b; --fg: #f3efff; --muted: #a89ec9;
    --accent: #a78bfa; --accent2: #fb7185; --grid: rgba(167,139,250,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-warm-sunrise {
    --bg: #2a1608; --fg: #fff7ed; --muted: #d6b899;
    --accent: #fb923c; --accent2: #ef4444; --grid: rgba(251,146,60,0.14);
    background: var(--bg); color: var(--fg);
  }
  .theme-cool-mint {
    --bg: #f2fbf6; --fg: #0f2e22; --muted: #5f8a78;
    --accent: #10b981; --accent2: #f59e0b; --grid: rgba(16,185,129,0.12);
    background: var(--bg); color: var(--fg);
  }
  .theme-ink-classic {
    --bg: #101210; --fg: #f5f0e6; --muted: #a89f8d;
    --accent: #d4af37; --accent2: #c0392b; --grid: rgba(212,175,55,0.12);
    background: var(--bg); color: var(--fg);
  }
</style>
</head>
<body>
<div id="number-counter" data-composition-id="number-counter"
     data-width="1920" data-height="1080" data-start="0" data-duration="8">

  <div class="nc-wrap">
    <h1 id="nc-headline" class="headline"></h1>
    <div class="nc-row">
      <span id="nc-prefix" class="affix"></span><span id="nc-number" class="number">0</span><span id="nc-suffix" class="affix"></span>
    </div>
    <p id="nc-subline" class="subline"></p>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById("number-counter");
  const v = window.__hyperframes
    ? window.__hyperframes.getVariables()
    : Object.fromEntries(JSON.parse(document.documentElement.getAttribute("data-composition-variables")).map(v => [v.id, v.default]));

  // 主题切换
  root.classList.add("theme-" + (v.theme || "dark-finance"));

  // 文案注入
  const headline = document.getElementById("nc-headline");
  const subline = document.getElementById("nc-subline");
  const numberEl = document.getElementById("nc-number");
  const prefixEl = document.getElementById("nc-prefix");
  const suffixEl = document.getElementById("nc-suffix");

  headline.textContent = v.headline;
  subline.textContent = v.subline;
  prefixEl.textContent = v.prefix || "";
  suffixEl.textContent = v.suffix || "";

  // 数字格式化：decimals 位小数 + 千分位逗号（纯确定性计算，无随机/网络）
  const endValue = Number(v.endValue) || 0;
  const decimals = Math.max(0, Math.min(6, Math.floor(Number(v.decimals) || 0)));
  function formatNum(x) {
    const neg = x < 0;
    const parts = Math.abs(x).toFixed(decimals).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + parts.join(".");
  }

  // 按最终字符长度自适应字号，避免超长数字溢出画布
  const totalLen = formatNum(endValue).length + (v.prefix || "").length + (v.suffix || "").length;
  numberEl.style.fontSize = (totalLen > 12 ? 180 : totalLen > 9 ? 220 : 300) + "px";

  const proxy = { n: 0 };
  numberEl.textContent = formatNum(0);

  // 动画（相对时间，秒）：入场 1.5s 内完成
  const tl = gsap.timeline({ paused: true });
  tl.from(headline, { opacity: 0, y: 40, duration: 0.5, ease: "power2.out" }, 0)
    .from(subline, { opacity: 0, duration: 0.4 }, 0.15)
    .from(prefixEl, { opacity: 0, x: -24, duration: 0.4 }, 0.2)
    .from(suffixEl, { opacity: 0, x: 24, duration: 0.4 }, 0.2)
    .from(numberEl, { opacity: 0, duration: 0.3 }, 0.25)
    .to(proxy, {
      n: endValue,
      duration: 0.95,
      ease: "power2.out",
      onUpdate: function () { numberEl.textContent = formatNum(proxy.n); }
    }, 0.45)
    .to({}, { duration: 1.5 }); // 尾部停留，保证总时长 ≥ 数据展示需要

  window.__timelines = window.__timelines || {};
  window.__timelines["number-counter"] = tl;
})();
</script>

<style>
[data-composition-id="number-counter"] { background: var(--bg); color: var(--fg); width: 1920px; height: 1080px; position: relative; }
  [data-composition-id="number-counter"] .nc-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 0 120px;
  }
  [data-composition-id="number-counter"] .headline {
    font-size: 64px; font-weight: 600; color: var(--muted); letter-spacing: 2px;
  }
  [data-composition-id="number-counter"] .nc-row {
    display: flex; align-items: baseline; justify-content: center;
    margin-top: 32px; white-space: nowrap;
  }
  [data-composition-id="number-counter"] .number {
    font-size: 300px; font-weight: 700; line-height: 1; letter-spacing: -4px;
  }
  [data-composition-id="number-counter"] .affix {
    font-size: 120px; font-weight: 600; color: var(--fg); opacity: 0.9;
  }
  [data-composition-id="number-counter"] .subline {
    font-size: 30px; color: var(--muted); margin-top: 36px;
  }
</style>
</body>
</html>
